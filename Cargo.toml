[workspace]
members = ["app"]

[workspace.package]
edition = "2024"
readme = "README.md"
homepage = "https://github.com/tomBoddaert/PixelSort/"
repository = "https://github.com/tomBoddaert/PixelSort"
license = "MIT OR Apache-2.0"
keywords = ["gpu", "art", "image"]
categories = ["algorithms", "graphics", "multimedia::images"]

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = "30.0.1"

[package]
name = "pixel-sort"
version = "0.1.0"
edition.workspace = true
description = "A GPU implementation of the pixel sort procedural art technique"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["/examples/source*.jpg", "comparison.png"]

[dependencies]
bytemuck.workspace = true
wgpu.workspace = true

[dev-dependencies]
env_logger = "0.11.11"
image = "0.25.10"
pollster = "1.0.1"
winit = "0.30.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Groups
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

allow_attributes = "warn"
get_unwrap = "warn"
panic_in_result_fn = "warn"
pub_without_shorthand = "warn"
redundant_type_annotations = "warn"
todo = "warn"
cognitive_complexity = "warn"
unwrap_used = "warn"
